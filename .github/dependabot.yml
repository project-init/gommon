version: 2
# Go modules and the mise Go pin are updated by the weekly devex workflow
# (.github/workflows/update-deps.yaml), which runs `devex sre dependencies upgrade --all`.
# That command moves go.mod, go.sum, and the mise pins together.
# Dependabot no longer opens a gomod pull request for the same modules.
# GitHub Actions stay here.

updates:
  # Github Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
