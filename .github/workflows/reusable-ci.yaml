name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4.2.3
        with:
          install: true
          experimental: true
          cache: true

      - name: Unit Test
        run: mise test:unit

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4.2.3
        with:
          install: true
          experimental: true
          cache: true

      - name: Integration Test
        run: mise test:integration

      - name: LocalStack diagnostics
        if: ${{ failure() }}
        run: mise dev:logs:infrastructure
