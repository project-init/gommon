services:
  localstack:
    # The current `latest` image requires a LocalStack auth token. Keep the
    # integration tests on the last community release so CI remains offline
    # and does not depend on a developer's LocalStack account.
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    volumes:
      - ./localstack:/etc/localstack/init/ready.d:ro
    environment:
      AWS_DEFAULT_REGION: us-east-1
      SERVICES: eventbridge,sqs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 5s
      retries: 30
