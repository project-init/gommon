[tools]
go = "1.25.5"
node = "25.7.0"
prettier = "3.8.1"
golangci-lint = "2.7.2"
gotestsum = "1.13.0"

[env]
MISE_DISABLE_BACKENDS = "aqua,ubi"

[settings]
experimental = true

# Tests

[tasks.test]
depends = [
    "unit-test"
]

[tasks.unit-test]
run = "gotestsum --format testname -- ./..."

# Linting

[tasks.lint]
depends = [
    "lint-go",
    "lint-prettier",
]

[tasks.lint-go]
run = "golangci-lint run --fix"

[tasks.lint-prettier]
depends = ["format-prettier-sync"]
run = "prettier --config ./prettier.config.json --ignore-path ./.prettierignore --check \"**/*.{md,yml,yaml}\""

[tasks.format]
depends = [
    "format-prettier",
    "format-go",
]

[tasks.format-prettier-sync]
run = "sh ./scripts/sync-prettier-config.sh"

[tasks.format-prettier]
depends = ["format-prettier-sync"]
run = "prettier --config ./prettier.config.json --ignore-path ./.prettierignore --write \"**/*.{md,yml,yaml}\""

[tasks.format-go]
run = "go fmt ./..."

# Release

[tasks.start-release]
run = "./scripts/git-tag-release.sh"
