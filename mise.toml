[tools]
go = "1.26.1"
bun = "1.3.9"
golangci-lint = "2.11.2"
gotestsum = "1.13.0"

# Internal
"go:github.com/project-init/devex/cmd/release" = "0.7.0"

[env]
MISE_DISABLE_BACKENDS = "aqua,ubi"

[settings]
experimental = true
npm.bun = true

# Setup

[tasks.setup]
run = "bun install"

# Tests

[tasks.test]
depends = [
  "unit-test"
]

[tasks.unit-test]
run = "gotestsum --format testname -- ./..."

# Linting

[tasks.lint]
depends = ["lint-*"]

[tasks.lint-go]
run = "golangci-lint run --fix"

[tasks.lint-prettier]
depends = ["setup", "format-prettier-sync"]
run = "bun run lint"

[tasks.format]
depends = ["format-*"]

[tasks.format-prettier-sync]
run = "sh ./scripts/sync-prettier-config.sh"

[tasks.format-prettier]
depends = ["setup", "format-prettier-sync"]
run = "bun run format"

[tasks.format-go]
run = "go fmt ./..."
